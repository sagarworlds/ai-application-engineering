<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo replay</title>
<style>
  :root { --bg: #0f1419; --panel: #151b23; --fg: #d7dde5; --dim: #7d8794; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; flex-direction: column; font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; }
  header { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--panel);
           color: var(--dim); font-size: 13px; border-bottom: 1px solid #232b36; }
  header i { width: 11px; height: 11px; border-radius: 50%; background: #3a4452; }
  header span { margin-left: 10px; }
  #screen { flex: 1; overflow: hidden; padding: 14px 20px; color: var(--fg); font-size: 14px; line-height: 19px;
            white-space: pre-wrap; overflow-wrap: anywhere; }
  .b { font-weight: 700; color: #ffffff; } .d { color: var(--dim); }
  .c30 { color: #7d8794; } .c31 { color: #ff7b72; } .c32 { color: #7ee787; } .c33 { color: #e3b341; }
  .c34 { color: #79c0ff; } .c35 { color: #d2a8ff; } .c36 { color: #56d4dd; } .c37 { color: var(--fg); }
  .c90 { color: #7d8794; }
</style>
</head>
<body>
<header><i></i><i></i><i></i><span>scripts/demo.sh — Enterprise Knowledge Assistant</span></header>
<div id="screen"></div>
<script>
  // A deliberately small terminal: it understands the two things demo.sh and jq emit —
  // SGR colour codes and "clear screen" — and ignores every other escape sequence.
  const CLEAR = '\u001b[2J\u001b[H';
  const screen = document.getElementById('screen');
  let style = { bold: false, dim: false, colour: null };

  function applySgr(codes) {
    for (const code of codes.length ? codes : [0]) {
      if (code === 0) style = { bold: false, dim: false, colour: null };
      else if (code === 1) style.bold = true;
      else if (code === 2) style.dim = true;
      else if (code === 22) { style.bold = false; style.dim = false; }
      else if (code === 39) style.colour = null;
      else if ((code >= 30 && code <= 37) || (code >= 90 && code <= 97)) style.colour = code >= 90 ? 90 : code;
    }
  }

  function writeText(text) {
    if (!text) return;
    const span = document.createElement('span');
    span.className = [style.bold ? 'b' : '', style.dim ? 'd' : '', style.colour ? `c${style.colour}` : ''].join(' ').trim();
    span.textContent = text;
    screen.appendChild(span);
  }

  function write(data) {
    for (const [index, part] of data.split(CLEAR).entries()) {
      if (index > 0) { screen.replaceChildren(); applySgr([0]); }
      let rest = part;
      for (let match; (match = /\u001b\[([0-9;]*)([A-Za-z])/.exec(rest)); rest = rest.slice(match.index + match[0].length)) {
        writeText(rest.slice(0, match.index));
        if (match[2] === 'm') applySgr(match[1].split(';').filter(Boolean).map(Number));
      }
      writeText(rest);
    }
    screen.scrollTop = screen.scrollHeight;
  }

  // Replays events with their recorded timing. Resolves when the last event has been shown.
  window.play = (events, holdMs) => new Promise((resolve) => {
    const origin = events[0].t;
    for (const event of events) setTimeout(() => write(event.data), event.t - origin);
    setTimeout(resolve, events.at(-1).t - origin + holdMs);
  });

  // Shows one scene (the output between two screen clears) in its final state, for screenshots.
  window.showScene = (events, sceneNumber) => {
    const scenes = events.map((event) => event.data).join('').split(CLEAR);
    screen.replaceChildren(); applySgr([0]);
    write(scenes[sceneNumber] ?? '');
    return scenes.length - 1;
  };
</script>
</body>
</html>
